[workspace]
authors = ["Akshai"]
channels = ["conda-forge"]
name = "harmonise"
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]
version = "0.1.0"

[tasks]
merge = "python merge_files.py"
lab = "jupyter lab"
app = "python app/app.py"

[dependencies]
python = "3.12.*"
pyproj = ">=3.8.0,<4"

[pypi-dependencies]
geopandas = "==1.1.2"
gradio = "==6.30.0"
jupyterlab = "==4.3.4"
matplotlib = "==3.10.8"
nonconformist = "==2.1.0"
numpy = "==2.1.3"
plotly = "==6.9.0"
pandas = "==2.2.3"
scikit-learn = "==1.5.2"
scipy = "==1.15.1"
seaborn = "==0.13.2"
shap = "==0.48.0"
tqdm = "==4.66.5"
